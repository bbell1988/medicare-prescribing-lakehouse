[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicare-lakehouse"
version = "0.1.0"
description = "PySpark/Delta pipeline for CMS Medicare Part D prescribing data"
requires-python = ">=3.10"
# Spark is provided by the Databricks runtime, so it is only a dev dependency.
dependencies = []

[project.optional-dependencies]
dev = ["pyspark>=3.5", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
